# Modern AI Tell Reference Catalog
#
# This catalog bridges two categories of indicators:
# 1. Modern Lexical Overuse: Words and connectors empirically overrepresented in
#    current LLM drafts compared to pre-2022 human baseline writing on identical facts.
# 2. Structural Patterns: Sentence and paragraph-level templates documented by
#    editorial projects like Wikipedia's "Signs of AI writing".

[lexical_frequency]
notes = "Frequencies measured per 1,000 words across fact-grounded model rewrites versus historical human baseline texts."

[[lexical_frequency.tokens]]
token = "specifically"
ratio_vs_human = 5.4
human_rate_per_1k = 0.12
ai_rate_per_1k = 0.64
context = "Overused as a transitional focalizer and emphasis connector."

[[lexical_frequency.tokens]]
token = "essential"
ratio_vs_human = 8.3
human_rate_per_1k = 0.06
ai_rate_per_1k = 0.49
context = "Overused evaluative modifier to signal importance without concrete justification."

[[lexical_frequency.tokens]]
token = "though"
ratio_vs_human = 5.0
human_rate_per_1k = 0.28
ai_rate_per_1k = 1.40
context = "Frequent clause-linking contrast word."

[[lexical_frequency.tokens]]
