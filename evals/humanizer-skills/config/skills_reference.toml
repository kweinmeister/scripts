# Pinned Upstream Skills Evaluated in the Benchmark
#
# Credit to the open-source maintainers who shared these workflows openly.
# Pinned commits ensure benchmark reproducibility across all test runs.

[prompt]
skill_template = """Use /{skill} to edit `input.md` to remove signs of AI writing, if there are any. Keep the meaning, facts, and register. Don't ask clarifying questions. Write only the final text to `output.md`, with no change summary or notes."""
control_template = """Edit `input.md` to remove signs of AI writing, if there are any. Keep the meaning, facts, and register. Don't ask clarifying questions. Write only the final text to `output.md`, with no change summary or notes."""

[control]
id = "control"
name = "Direct Prompt Baseline"

