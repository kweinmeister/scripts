# Structural and rhetorical patterns
[[structural_patterns]]
id = "staged-opener"
category = "structure"
description = "A generic, relatable opening thought that introduces a broad theme before pivoting to the topic."
example = "When we think of Thanksgiving, we often conjure images of heavy feasts and family reunions. Yet..."
detection_cue = "Begins with 'When we think of', 'In today's fast-paced world', or 'Throughout history'."

[[structural_patterns]]
id = "colon-question"
category = "structure"
description = "A reflective question held back behind a colon as a dramatic transition device."
example = "Yet, as a folklorist, I find myself wondering: where is the music?"
detection_cue = "Colon immediately preceding a direct rhetorical question."

[[structural_patterns]]
id = "negative-parallelism"
category = "rhetoric"
description = "A 'Not X, but Y' contrast construction used to create synthetic depth."
example = "It is not merely a tool, but a transformative shift in how teams collaborate."
detection_cue = "Phrasing matching 'not only... but', 'not just X, it's Y', or 'it is not X, but Y'."

[[structural_patterns]]
id = "forced-triad"
category = "rhetoric"
description = "A list of three parallel adjectives or actions chosen for rhythmic cadence rather than information."
example = "The framework provides clarity, efficiency, and alignment across projects."
detection_cue = "A series of exactly three short parallel terms joined by 'and' or 'or'."

[[structural_patterns]]
id = "copulative-avoidance"
category = "tone"
description = "Avoiding simple verbs like 'is' or 'has' in favor of grander substitutes."
example = "The library serves as a testament to civic engagement."
detection_cue = "Frequent substitution with 'serves as', 'stands as', 'functions as', or 'boasts'."

[[structural_patterns]]
id = "superficial-ing-clause"
category = "syntax"
description = "A trailing participial phrase tacked onto the end of a sentence to provide generic editorializing."
example = "...the team updated the deployment manifest, ensuring seamless continuity and fostering long-term resilience."
detection_cue = "Comma followed by trailing '-ing' verbs like highlighting, underscoring, reflecting, ensuring, fostering."

[[structural_patterns]]
id = "inline-bold-labels"
category = "formatting"
description = "Overly formulaic bullet lists where every item begins with a bolded category label."
example = "- **Enhanced Reliability:** The system handles failover gracefully."
detection_cue = "Consistent markdown list items beginning with '**Word/Phrase:**'."

[[structural_patterns]]
id = "decorative-emoji"
category = "formatting"
description = "Unprompted emoji icons used as bullet adornments or section markers in technical text."
example = "🚀 Getting Started | 💡 Key Concept | ⚠️ Important Note"
detection_cue = "Emoji characters positioned at the start of headings or list entries."
